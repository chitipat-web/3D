<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ZX-6R studio renders</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>html,body{margin:0;background:#777}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';

window.addEventListener('error', (e) => { window.__error = String(e.message || e); });
window.addEventListener('unhandledrejection', (e) => { window.__error = String(e.reason && (e.reason.stack || e.reason)); });

try {
  if (new URLSearchParams(location.search).get('nonormals') === '1') globalThis.__noAnalyticNormals = true;
  // backdbg=1 paints the inner faces of the painted panels magenta
  if (new URLSearchParams(location.search).get('backdbg') === '1') globalThis.__backDebug = true;
  const { buildZX6R } = await import('../src/zx6r.js');
  const { loadLiveryFonts } = await import('../src/fonts.js');
  window.__fontsOk = await loadLiveryFonts('../assets/fonts/');
  const { createEnvironment, addStudioLights, createFloor, loadStudioHDR } = await import('../src/studio.js');
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 1400), H = +(q.get('h') || 900);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.toneMapping = q.get('tm') === 'aces' ? THREE.ACESFilmicToneMapping : THREE.NeutralToneMapping;
  renderer.toneMappingExposure = +(q.get('exp') || 1.0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = q.get('noshadow') !== '1';
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(q.get('bg') || '#cfd2d4');
  const dark = q.get('dark') === '1';
  const hdrEnv = q.get('hdr') === '0' || q.get('sky') ? null : await loadStudioHDR(renderer, '../assets/studio_small_08_1k.hdr', { overhead: +(q.get('over') ?? 0.7) });
  scene.environment = hdrEnv || createEnvironment(renderer, { dark });
  if (q.get('sky')) {
    // sky=1: open-air light (bright sky, pale walls, dark gravel) to compare
    // panel forms with outdoor photos, where up-facing facets catch the sky
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 48, 24), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(vec3(0.75,0.74,0.72), vec3(1.25,1.32,1.45), pow(h, 0.7)) : mix(vec3(0.5,0.49,0.47), vec3(0.16,0.155,0.15), pow(-h, 0.35)); gl_FragColor = vec4(c, 1.0); }',
    })));
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.02).texture;
  }
  scene.environmentIntensity = +(q.get('env') || 1.15);
  scene.environmentRotation.set(0, (+(q.get('rot') ?? 135) * Math.PI) / 180, 0);
  const L = addStudioLights(scene, { dark });
  if (hdrEnv) {
    L.key.intensity = +(q.get('key') || 1.7);
    L.fill.intensity = 0.25;
    L.hemi.intensity = 0.0;
  }
  // left=1 lights the bike's left side (for comparisons with left-side photos)
  if (q.get('left') === '1') {
    L.key.position.z *= -1;
    L.fill.position.z *= -1;
    scene.environmentRotation.y += Math.PI;
  }
  scene.add(createFloor(q.get('bg') || '#cfd2d4'));

  // bodycol=rrggbb overrides the livery's body (black) paint, for tone tests
  // (primcol=rrggbb likewise for the primary colour)
  if (q.get('bodycol') || q.get('primcol')) {
    const { LIVERIES } = await import('../src/materials.js');
    const Lv = LIVERIES[q.get('livery') || 'krt'];
    if (q.get('bodycol')) Lv.body.color = '#' + q.get('bodycol');
    if (q.get('primcol')) Lv.primary.color = '#' + q.get('primcol');
  }
  const bike = buildZX6R({ livery: q.get('livery') || 'krt' });
  // naked=1 hides the bodywork (to compare with photos of the bare chassis)
  if (q.get('naked') === '1') bike.traverse((o) => { if (o.name === 'Bodywork') o.visible = false; });
  bike.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(bike);

  // diagnostics: draw the named meshes solid black (e.g. the clear screen)
  // paintenv=k scales the environment reflection of the painted panels,
  // paintcc=r sets their clearcoat roughness (material experiments)
  if (q.get('paintenv') || q.get('paintcc') || q.get('paintrough') || q.get('paintmetal') || q.get('paintcol')) {
    const Mt = bike.userData.materials;
    for (const k of ['body', 'accent', 'decalSide', 'decalSideL', 'plasticGloss']) {
      if (q.get('paintenv')) Mt[k].envMapIntensity = +q.get('paintenv');
      if (q.get('paintcc')) Mt[k].clearcoatRoughness = +q.get('paintcc');
      if (q.get('paintrough')) Mt[k].roughness = +q.get('paintrough');
      if (q.get('paintmetal')) Mt[k].metalness = +q.get('paintmetal');
    }
    if (q.get('paintcol')) Mt.body.color.set('#' + q.get('paintcol'));
  }
  // paintall=rrggbb repaints every painted panel in one plain gloss colour,
  // to compare the panel forms with photos of the single-colour bikes
  if (q.get('paintall')) {
    const Mt = bike.userData.materials;
    const keys = ['primary', 'body', 'accent', 'decalSide', 'decalSideL', 'decalLower', 'decalLowerL', 'decalFront', 'plasticGloss'];
    const plain = new THREE.MeshPhysicalMaterial({ color: new THREE.Color('#' + q.get('paintall')), roughness: 0.3, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08, side: THREE.DoubleSide });
    const paint = new Set(keys.map((k) => Mt[k]).filter(Boolean));
    bike.traverse((o) => { if (o.isMesh && paint.has(o.material)) o.material = plain; });
  }
  // dbg=Mesh1,Mesh2&dbgmode=noenv|nocc|nomap|normals: per-mesh material probes
  if (q.get('dbg')) {
    const names = q.get('dbg').split(',');
    const mode = q.get('dbgmode') || 'noenv';
    bike.traverse((o) => {
      if (!o.isMesh || !names.includes(o.name)) return;
      if (mode === 'normals') { o.material = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide }); return; }
      o.material = o.material.clone();
      if (mode === 'noenv') o.material.envMapIntensity = 0;
      if (mode === 'nocc') o.material.clearcoat = 0;
      if (mode === 'nomap') o.material.map = null;
      o.material.needsUpdate = true;
    });
  }
  // (name or name:rrggbb; e.g. solid=ScreenGlass,MainFrame:ff0000)
  if (q.get('solid')) {
    const map = Object.fromEntries(q.get('solid').split(',').map((e) => { const [n, c] = e.split(':'); return [n, c || '000000']; }));
    const mats = {};
    bike.traverse((o) => {
      if (!o.isMesh || !(o.name in map)) return;
      const c = map[o.name];
      o.material = mats[c] || (mats[c] = new THREE.MeshBasicMaterial({ color: new THREE.Color('#' + c), side: THREE.DoubleSide }));
    });
  }

  if (q.get('ref')) {
    // reference silhouette grid: 10 cm lines on a vertical plane at z = -0.5
    const grid = new THREE.GridHelper(3, 30, 0xff0000, 0x999999);
    grid.rotation.x = Math.PI / 2;
    grid.position.set(0, 1.5, -0.4);
    scene.add(grid);
  }

  const views = {
    side: { p: [0, 0.58, 9.5], t: [0, 0.58, 0], fov: 14 },
    left: { p: [0, 0.58, -9.5], t: [0, 0.58, 0], fov: 14 },
    front34: { p: [2.7, 1.25, 2.6], t: [0.05, 0.55, 0], fov: 30 },
    rear34: { p: [-2.8, 1.3, 2.3], t: [-0.1, 0.55, 0], fov: 30 },
    front: { p: [6.5, 0.7, 0], t: [0, 0.6, 0], fov: 14 },
    rear: { p: [-6.5, 0.8, 0], t: [0, 0.6, 0], fov: 14 },
    top: { p: [0, 7.5, 0.0001], t: [0, 0, 0], fov: 18 },
    photo: { p: [2.0, 0.95, 3.2], t: [0.0, 0.55, 0], fov: 33 },
    leftfront: { p: [1.6, 1.4, -2.8], t: [0.05, 0.55, 0], fov: 32 },
    nose: { p: [2.3, 1.0, 0.9], t: [0.75, 0.78, 0], fov: 26 },
    detailRear: { p: [-1.2, 0.8, 1.6], t: [-0.55, 0.5, 0], fov: 30 },
    cockpit: { p: [-0.6, 1.55, 0.25], t: [0.5, 0.85, 0], fov: 40 },
  };
  if (q.get('cam')) {
    const v = q.get('cam').split(',').map(Number);
    views.custom = { p: v.slice(0, 3), t: v.slice(3, 6), fov: v[6] || 30 };
  }
  if (q.get('camE')) {
    // explicit camera from a solved photo match: px,py,pz,rx,ry,rz,fov (Euler YXZ)
    const v = q.get('camE').split(',').map(Number);
    views.camE = { e: v };
  }
  const list = (q.get('views') || 'side,front34,rear34,front,top').split(',');
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 200);
  const shots = [];
  if (q.get('ortho') === 'side19') {
    // matches the calibrated 2019 KRT studio side photo (1300 x 710, left side)
    renderer.setSize(1300, 710);
    const oc = new THREE.OrthographicCamera(-1.1272, 1.1512, 1.1786, -0.0658, 0.1, 30);
    oc.position.set(0, 0, -10);
    oc.lookAt(0, 0, 0);
    scene.background = new THREE.Color(q.get('obg') ? '#' + q.get('obg') : '#ffffff');
    renderer.render(scene, oc);
    shots.push({ name: (q.get('prefix') || '') + 'ortho_side19', data: renderer.domElement.toDataURL('image/png') });
    list.length = 0;
  }
  if (q.get('ortho') === 'naked19') {
    // matches the 2019 studio photo of the bike without bodywork (1257 x 689, left side)
    renderer.setSize(1257, 689);
    const oc = new THREE.OrthographicCamera(-1.1027, 1.152, 1.1318, -0.104, 0.1, 30);
    oc.position.set(0, 0, -10);
    oc.lookAt(0, 0, 0);
    scene.background = new THREE.Color(q.get('obg') ? '#' + q.get('obg') : '#ffffff');
    renderer.render(scene, oc);
    shots.push({ name: (q.get('prefix') || '') + 'ortho_naked19', data: renderer.domElement.toDataURL('image/png') });
    list.length = 0;
  }
  if (q.get('ortho') === 'right19') {
    // matches the calibrated 2019 KRT studio right-side photo (1400 x 788)
    renderer.setSize(1400, 788);
    const oc = new THREE.OrthographicCamera(-1.1509, 1.1281, 1.188, -0.0948, 0.1, 30);
    oc.position.set(0, 0, 10);
    oc.lookAt(0, 0, 0);
    scene.background = new THREE.Color(q.get('obg') ? '#' + q.get('obg') : '#ffffff');
    renderer.render(scene, oc);
    shots.push({ name: (q.get('prefix') || '') + 'ortho_right19', data: renderer.domElement.toDataURL('image/png') });
    list.length = 0;
  }
  for (const name of list) {
    const v = views[name];
    if (!v) continue;
    camera.aspect = W / H;
    if (v.e) {
      camera.fov = v.e[6];
      camera.position.set(v.e[0], v.e[1], v.e[2]);
      camera.rotation.set(v.e[3], v.e[4], v.e[5], 'YXZ');
    } else {
      camera.fov = v.fov;
      camera.position.set(...v.p);
      camera.lookAt(new THREE.Vector3(...v.t));
    }
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    shots.push({ name: (q.get('prefix') || '') + name, data: renderer.domElement.toDataURL('image/png') });
  }
  if (q.get('export')) {
    let bytes;
    bike.updateMatrixWorld(true);
    if (q.get('export') === 'usdz') {
      const { USDZExporter } = await import('three/addons/exporters/USDZExporter.js');
      bytes = await new USDZExporter().parseAsync(bike, { quickLookCompatible: true, maxTextureSize: 2048 });
    } else {
      const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
      bytes = new Uint8Array(await new GLTFExporter().parseAsync(bike, { binary: true, onlyVisible: true }));
    }
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    window.__glb = btoa(bin);
    const box = new THREE.Box3().setFromObject(bike);
    window.__bbox = { min: box.min.toArray(), max: box.max.toArray() };
  }
  let tris = 0, meshes = 0;
  bike.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  window.__stats = { meshes, tris: Math.round(tris), calls: renderer.info.render.calls };
  if (q.get('meshstats')) {
    const list = [];
    bike.traverse((o) => { if (o.isMesh) { const g = o.geometry; list.push([o.name, (g.index ? g.index.count : g.attributes.position.count) / 3, g.attributes.position.count]); } });
    list.sort((a, b) => b[1] - a[1]);
    window.__stats.top = list.slice(0, 25).map(([n, t, v]) => `${n}:${Math.round(t)}t/${v}v`);
  }
  window.__shots = shots;
} catch (e) {
  window.__error = String(e && (e.stack || e));
}
</script>
</body>
</html>
